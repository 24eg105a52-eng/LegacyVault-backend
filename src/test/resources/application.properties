# Test configuration fallback for Maven test runs
spring.datasource.url=jdbc:mysql://localhost:3306/legacy_vault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
jwt.secret=LegacyVaultSecretKeyMustBeAtLeast256BitsLongForHMACSHA256SignatureRequirements
jwt.expiration-ms=86400000
vault.encryption.secret=LegacyVaultMasterEncryptionSecretAES256GCMKey2026
vault.storage.upload-dir=./target/test_vault_files
vault.inactivity.scheduler.enabled=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.mail.host=localhost
spring.mail.port=25
vault.mail.from=noreply@legacyvault.local
