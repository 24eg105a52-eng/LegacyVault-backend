# ==============================================================================
# LegacyVault Backend Application Configuration
# ==============================================================================
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# MySQL Database Connection Configuration (Default for Local Development)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/legacy_vault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
# Validates schema at startup without destructive DDL changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Dialect is auto-detected by Hibernate 6 based on active DataSource (PostgreSQL on Render, MySQL locally)
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Security & Token Configuration
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:LegacyVaultSecretKeyMustBeAtLeast256BitsLongForHMACSHA256SignatureRequirements}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
vault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ------------------------------------------------------------------------------
# Digital Vault Encryption (AES-256-GCM)
# ------------------------------------------------------------------------------
vault.encryption.secret=${VAULT_ENCRYPTION_SECRET:LegacyVaultMasterEncryptionSecretAES256GCMKey2026}

# ------------------------------------------------------------------------------
# Secure File Storage Configuration (Persistent Disk mountable on Render)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
vault.storage.upload-dir=${VAULT_STORAGE_DIR:${VAULT_UPLOAD_DIR:./storage/vault_files}}

# ------------------------------------------------------------------------------
# SMTP Email Delivery Configuration (Configurable via Environment Variables)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
vault.mail.from=${MAIL_FROM:noreply@legacyvault.local}

# ------------------------------------------------------------------------------
# SMS Provider Configuration (Twilio HTTP API - Optional)
# ------------------------------------------------------------------------------
vault.sms.account-sid=${TWILIO_ACCOUNT_SID:}
vault.sms.auth-token=${TWILIO_AUTH_TOKEN:}
vault.sms.from-phone=${TWILIO_PHONE_NUMBER:}

# ------------------------------------------------------------------------------
# Automated Inactivity Watchdog Scheduler
# ------------------------------------------------------------------------------
vault.inactivity.scheduler.enabled=${INACTIVITY_SCHEDULER_ENABLED:true}
vault.inactivity.scheduler.rate-ms=${INACTIVITY_CHECK_RATE_MS:3600000}

